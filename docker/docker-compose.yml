services:
  sentinel-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sentinel-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ../audit.jsonl:/app/audit.jsonl
    restart: unless-stopped

  sentinel-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sentinel-api
    command: ["uvicorn", "sentinel.server.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ../audit.jsonl:/app/audit.jsonl
    restart: unless-stopped
