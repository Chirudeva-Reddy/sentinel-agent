[project]
name = "sentinel-agent"
version = "0.1.0"
description = "Zero-Trust Security Gateway & Human-in-the-Loop Sandbox for Autonomous AI Agents"
readme = "README.md"
authors = [
    { name = "Chirudeva Reddy", email = "chirudevareddy03@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pip-audit>=2.7.0",
    "ruff>=0.4.0",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[project.entry-points."sentinel.detectors"]
argument_validator = "sentinel.detectors.argument_validator:ArgumentValidator"
blast_radius = "sentinel.detectors.blast_radius:BlastRadiusDetector"
injection = "sentinel.detectors.injection:InjectionDetector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not benchmark and not slow' --benchmark-disable"
markers = [
    "redteam: attack corpus cases",
    "integration: crosses a process, socket or real store",
    "slow: excluded from PR runs",
]

[tool.coverage.run]
source = ["sentinel"]
omit = ["sentinel/server/dashboard.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "UP006", "UP035"]


[tool.mypy]
python_version = "3.10"
packages = ["sentinel.core", "sentinel.detectors", "sentinel.normalize", "sentinel.taint"]
strict = true
plugins = ["pydantic.mypy"]
