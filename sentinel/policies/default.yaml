# SentinelAgent default policy: the ONLY place defaults live. PolicyConfig() == this file.
# A custom policy file only needs the keys it changes; missing keys fall back to these.
version: "1.0"
safe_threshold: 30.0
critical_threshold: 70.0

# How detector scores combine: noisy_or (independent evidence corroborates) or max.
aggregation: "noisy_or"

# A detector slower than this is reported as a SUSPICIOUS finding (fail closed on slowness).
detector_budget_ms: 250.0

# Tools not listed anywhere below get this decision floor (deny by default).
unknown_tool_action: "REQUIRE_APPROVAL"

# Hosts exempt from SSRF checks. Empty in the default policy; a dev policy might add "localhost".
allowed_hosts: []

# Known tools. Detectors still run on their arguments; listing a tool only lifts the unknown-tool floor.
allowed_tools:
  - "read_file"
  - "view_file"
  - "write_file"
  - "search_web"
  - "list_directory"
  - "calculator"
  - "get_weather"
  - "summarize_text"
  - "translate_text"
  - "fetch_url"
  - "execute_sql"
  - "query_database"

blocked_tools:
  - "bypass_security"
  - "dump_credentials"
  - "arbitrary_eval"

require_approval_tools:
  - "execute_bash"
  - "shell"
  - "run_command"
  - "run_shell"
  - "terminal"
  - "delete_file"
  - "drop_database"
  - "transfer_funds"
  - "send_email"
  - "git_push_force"

sensitive_paths:
  - "/etc/passwd"
  - "/etc/shadow"
  - "~/.ssh"
  - "~/.aws"
  - ".env"
  - "id_rsa"
  - "id_ed25519"
  - "/var/run/docker.sock"

# Extra substring signatures. Destructive shell commands (rm -r /, find / -delete, mkfs, dd of=/dev,
# curl | sh, fork bombs) are detected by parsing argv in BlastRadiusDetector, not listed here.
blocked_commands: []
